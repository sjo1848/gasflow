name: Verified Android media

on:
  push:
    branches:
      - verified-media
    paths:
      - '.github/workflows/verified-media.yml'
      - 'scripts/capture_android_media.py'
      - 'mobile/**'
      - 'backend/**'
      - 'docker-compose.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verified-media.yml'
      - 'scripts/capture_android_media.py'
      - 'mobile/**'
      - 'backend/**'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gasflow-verified-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Build app and capture Android evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Align Kotlin and Compose compiler
        working-directory: mobile
        run: |
          mapfile -t kotlin_files < <(
            grep -RIl --exclude='package-lock.json' '1\.9\.24' android node_modules/expo-modules-core/android
          )
          if [ "${#kotlin_files[@]}" -eq 0 ]; then
            echo 'No Kotlin 1.9.24 declarations were found.'
            grep -RIn 'kotlinVersion\|kotlin_version\|1\.9\.' android node_modules/expo-modules-core/android | head -100
            exit 1
          fi
          printf 'Updating Kotlin declarations in:\n%s\n' "${kotlin_files[*]}"
          sed -i 's/1\.9\.24/1.9.25/g' "${kotlin_files[@]}"
          if grep -RIq --exclude='package-lock.json' '1\.9\.24' android node_modules/expo-modules-core/android; then
            echo 'Kotlin 1.9.24 remains after alignment.'
            grep -RIn --exclude='package-lock.json' '1\.9\.24' android node_modules/expo-modules-core/android
            exit 1
          fi
          grep -RIn --exclude='package-lock.json' '1\.9\.25' android node_modules/expo-modules-core/android | head -100

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew app:assembleRelease --no-daemon

      - name: Start seeded backend
        run: docker compose up -d --build

      - name: Validate backend and demo users
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"admin123"}' \
            http://127.0.0.1:8080/auth/login > /tmp/admin-login.json
          curl --fail --silent \
            -H 'content-type: application/json' \
            -d '{"username":"repartidor","password":"repartidor123"}' \
            http://127.0.0.1:8080/auth/login > /tmp/driver-login.json

      - name: Run emulator and capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          script: |
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            SOURCE_COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" python3 scripts/capture_android_media.py

      - name: Upload verified media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gasflow-verified-media-${{ github.sha }}
          path: artifacts/verified-media/
          if-no-files-found: error
          retention-days: 7

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop backend
        if: always()
        run: docker compose down -v
